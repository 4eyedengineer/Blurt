name: Build macOS

# Builds the macOS (Apple Silicon) dmg on a real Mac. electron-builder cannot
# cross-build macOS targets from Linux or Windows, so this runner is the only
# way this artifact gets produced at all short of owning a Mac - and it is
# also, right now, the first time any of the darwin code paths have been
# compiled and packaged on real macOS rather than just unit-tested from Linux.
#
# Deliberately separate from ci.yml: that job is the fast typecheck/lint/test
# gate that runs on every push and PR, and it must stay cheap. This one is
# slower, produces a ~100 MB artifact, and is only worth running on demand or
# when the macOS branch itself moves.
on:
  push:
    branches: [macos-support]
  workflow_dispatch:

jobs:
  build:
    name: dmg (arm64)
    # macos-14 is GitHub's Apple Silicon image. The arch matters beyond just
    # "it's a Mac": the whole point of this build is arm64, because the
    # engine dependency litert-lm-api ships only a macosx_12_0_arm64 wheel
    # (see electron-builder.yml's mac: block for the full reasoning).
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same floor as ci.yml - electron-vite needs a Node with
          # crypto.hash (>= 20.19 / >= 22.12).
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` (typecheck + electron-vite bundle) then package,
      # rather than `npm run build:mac`, so the signing flags below can be
      # applied without editing the committed electron-builder.yml.
      - run: npm run build

      # THIS IS A TEST BUILD, NOT A RELEASE BUILD.
      #
      # A real distributable needs a Developer ID Application certificate and
      # notarization, which needs a paid Apple Developer account - see
      # MACOS.md. There is no certificate available to this runner, so the app
      # is ad-hoc signed (`identity: -`) instead.
      #
      # Ad-hoc signing is not optional on Apple Silicon: macOS refuses to
      # execute arm64 code with no signature at all, and repackaging Electron
      # invalidates the signature its own binaries shipped with. So "unsigned"
      # is not actually an available option here, only "ad-hoc" or "properly
      # signed".
      #
      # hardenedRuntime is forced off for the same reason electron-builder's
      # own docs give: hardened runtime combined with ad-hoc signing enforces
      # library validation, which then rejects the bundled uiohook-napi native
      # addon because ad-hoc signatures carry no Team ID to match against. The
      # committed config keeps hardenedRuntime on and library validation
      # enabled, which is correct for a real signed release; this override is
      # scoped to this test build only and does not weaken that config.
      #
      # Consequence for whoever downloads the result: it is ad-hoc signed, so
      # Gatekeeper will quarantine it on download and refuse to open it until
      # the quarantine attribute is removed. That is expected, and it is the
      # cost of not having a Developer ID yet.
      #
      # `--publish never` is required, not optional. electron-builder detects
      # CI and silently switches on implicit publishing, which then fails the
      # whole step with "GitHub Personal Access Token is not set" *after* the
      # dmg has already been built successfully - a confusing failure that has
      # nothing to do with packaging. This job's job is to produce an artifact
      # and nothing else; releasing is a separate, deliberate step.
      - name: Package (ad-hoc signed test build)
        run: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      # Surfaced explicitly because a packaging step that "succeeds" while
      # producing nothing (or producing an unexpected target) is otherwise
      # invisible until someone downloads an empty artifact.
      - name: List build output
        run: ls -la dist/ && file dist/*.dmg

      # Checks the handful of packaging facts that would silently produce a
      # broken app rather than a failed build, and that cannot be verified
      # from a Linux host at all (no codesign, no plutil, no lipo there).
      # Each one is a real failure mode this config newly controls:
      #
      #  - NSMicrophoneUsageDescription missing => macOS terminates the app
      #    outright the moment it asks for the mic, rather than denying it.
      #    That is the entire feature dead, with a crash instead of a prompt.
      #  - serve_gpu.py missing => extraResources did not land where
      #    gpuWrapperPath.ts resolves it, so the sidecar can never start.
      #  - a bad/absent signature => will not execute on Apple Silicon.
      #  - wrong arch => an x64 or universal build would install on an Intel
      #    Mac and then fail later at pip, which is exactly what arm64-only
      #    is meant to prevent.
      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="dist/mac-arm64/Blurt.app"
          test -d "$APP" || { echo "MISSING: $APP"; exit 1; }

          echo "--- Info.plist keys ---"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"

          echo "--- extraResources (sidecar wrapper must sit beside app.asar) ---"
          test -f "$APP/Contents/Resources/serve_gpu.py" || { echo "MISSING serve_gpu.py"; exit 1; }
          test -f "$APP/Contents/Resources/app.asar" || { echo "MISSING app.asar"; exit 1; }
          ls -la "$APP/Contents/Resources/" | head -20

          echo "--- architecture ---"
          lipo -archs "$APP/Contents/MacOS/"* || true

          echo "--- signature ---"
          codesign -dv --verbose=2 "$APP" 2>&1
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || \
            echo "NOTE: deep verify reported issues (expected for an ad-hoc signed build)"

      - uses: actions/upload-artifact@v4
        with:
          name: blurt-macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
