name: Build Windows

# Builds the Windows NSIS installer on a real Windows runner.
#
# This cannot be done from Linux or WSL, and not only for the usual
# cross-compilation reasons: `uiohook-napi` (the global key hook that
# push-to-talk is built on) is a native addon that has to be rebuilt against
# the target's toolchain, which needs Visual Studio Build Tools. A build
# produced anywhere else would either fail outright or, worse, package a
# key hook that cannot load - silently disabling the app's primary feature
# while every other part of it looks fine. See WINDOWS.md section 7.
#
# Deliberately separate from ci.yml, for the same reason build-macos.yml is:
# that job is the fast typecheck/lint/test gate on every push and must stay
# cheap. This one is slow, produces a ~100 MB artifact, and is only worth
# running on demand or when a release branch moves.
on:
  push:
    # main is where releases are cut from, so a release commit should
    # produce its installer without anyone remembering to trigger it.
    branches: [main, macos-support]
    # A `v*` tag is what turns a build into a publish - see the packaging
    # step. Branch pushes keep producing a downloadable artifact and nothing
    # else, so ordinary work on main can never touch a release.
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: nsis installer (x64)
    runs-on: windows-latest

    # Needed only on the tag path, where electron-builder creates the draft
    # release and uploads to it using the default GITHUB_TOKEN. The default
    # for this repo is read-only, so without this the publish fails at the
    # upload step, after a full ~10 minute build.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same floor as ci.yml - electron-vite needs a Node with
          # crypto.hash (>= 20.19 / >= 22.12).
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Create the draft release BEFORE electron-builder runs, so it attaches
      # to this one instead of making its own.
      #
      # Observed on the v1.4.2 build, which is why this exists: electron-builder
      # produced two draft releases for the same tag, in the same second, with
      # the assets split across them - installer and latest.yml on one, the
      # blockmap on the other. Its `getOrCreateRelease` lists releases and
      # reuses a matching draft, but a draft has no git tag to find until it is
      # published, so with none pre-existing, concurrent uploads each created
      # one. Publishing either half would have shipped an incomplete feed.
      #
      # Idempotent: if a release for this tag already exists (a re-run, or a
      # tag pushed twice) it is left exactly as-is rather than recreated.
      - name: Ensure a single draft release exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '[.[] | select(.tag_name=="'"$TAG"'")] | length')
          if [[ "$EXISTING" -gt 0 ]]; then
            echo "a release for $TAG already exists ($EXISTING) - leaving it alone"
          else
            gh release create "$TAG" --draft --title "Blurt ${TAG#v}" \
              --notes "Draft created by CI. Assets are attached by electron-builder; publish this release to ship the update."
            echo "created the draft release for $TAG"
          fi

      # Publish only on a `v*` tag; every other trigger builds an artifact and
      # nothing else.
      #
      # The explicit `--publish` flag is required either way, not optional.
      # electron-builder detects CI and silently switches on implicit
      # publishing, which on a branch push then fails the whole step with
      # "GitHub Personal Access Token is not set" *after* the installer has
      # already been built - a confusing failure with nothing to do with
      # packaging.
      #
      # On the tag path this uploads the installer, `latest.yml` and the
      # `.blockmap` to a DRAFT release (see electron-builder.yml's `publish:`
      # block). A draft's assets are not publicly readable, so nothing
      # auto-updates until that draft is published by hand.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY=false mirrors the build:win script: there
      # is no code-signing certificate, and without this electron-builder can
      # go looking for one. The installer is therefore unsigned, and
      # SmartScreen will warn on first run exactly as it does for the
      # released build (see README's Install section).
      - name: Package installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag build ($GITHUB_REF) - publishing to a draft release"
            npx electron-builder --win --publish always
          else
            echo "branch build - artifact only"
            npx electron-builder --win --publish never
          fi

      - name: List build output
        shell: bash
        run: ls -la dist/ && ls -la dist/win-unpacked/resources/

      # Checks the packaging facts that would silently produce a broken app
      # rather than a failed build. Each is a real failure mode:
      #
      #  - uiohook-napi missing or unbuilt => push-to-talk, the feature the
      #    app is actually for, fails to load at runtime while everything
      #    else works. This is the single most important check here and the
      #    whole reason this job runs on Windows.
      #  - serve_gpu.py missing => extraResources did not land where
      #    gpuWrapperPath.ts resolves it, so the sidecar can never start.
      #  - no installer produced => the job "succeeded" with nothing to ship.
      - name: Verify packaged output
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/win-unpacked || { echo "MISSING dist/win-unpacked"; exit 1; }

          echo "--- installer ---"
          ls dist/*.exe
          test -n "$(ls dist/*-setup.exe 2>/dev/null)" || { echo "MISSING *-setup.exe"; exit 1; }

          # latest.yml IS the update feed. electron-updater fetches it to
          # learn whether a newer version exists and to verify the download's
          # sha512 - without it every installed copy silently stops updating,
          # with nothing wrong on either side that anyone would notice until
          # a release goes out and nobody receives it. It only gets generated
          # because electron-builder.yml declares `publish:`, so this also
          # catches that block being removed or mistyped.
          echo "--- update feed ---"
          test -f dist/latest.yml || { echo "MISSING latest.yml - auto-update would be dead"; exit 1; }
          cat dist/latest.yml
          # The blockmap is what makes an update a few MB instead of ~94 MB.
          # Its absence degrades rather than breaks, so this warns.
          ls dist/*-setup.exe.blockmap 2>/dev/null || \
            echo "NOTE: no .blockmap - updates would download the full installer"

          echo "--- extraResources (sidecar wrapper must sit beside app.asar) ---"
          test -f dist/win-unpacked/resources/serve_gpu.py || { echo "MISSING serve_gpu.py"; exit 1; }
          test -f dist/win-unpacked/resources/app.asar || { echo "MISSING app.asar"; exit 1; }
          # asr.py is imported by serve_gpu.py as a plain `import asr`, which
          # resolves via the script's own directory - so it has to be in the
          # same directory, not merely present somewhere. Without it every
          # dictation fails while the app otherwise starts perfectly.
          test -f dist/win-unpacked/resources/asr.py || { echo "MISSING asr.py"; exit 1; }

          # Assert the WINDOWS binary specifically. uiohook-napi ships
          # prebuilds for every platform in its npm package, so simply
          # finding "a uiohook-napi.node" proves nothing - an earlier
          # version of this check globbed, truncated with `head -5`, and
          # passed while printing only darwin and linux prebuilds. The one
          # binary this app needs on this platform is the one it never
          # looked at.
          echo "--- native key hook (push-to-talk) ---"
          HOOK=dist/win-unpacked/resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/win32-x64/uiohook-napi.node
          test -f "$HOOK" || { echo "MISSING win32-x64 uiohook-napi.node - push-to-talk would not load"; exit 1; }
          ls -l "$HOOK"
          echo "  (all prebuilds present, for reference:)"
          ls dist/win-unpacked/resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/

          echo "--- d3d/dxc shipped for the GPU path ---"
          ls dist/win-unpacked/dxcompiler.dll dist/win-unpacked/dxil.dll 2>/dev/null || \
            echo "NOTE: dxcompiler/dxil not present - GPU (Dawn D3D12) path may be unavailable"

      # The publish half of "Verify packaged output": that step proves the three
      # files were BUILT, this proves they all landed on ONE release. The v1.4.2
      # build passed every packaging check and still produced a split feed (see
      # the pre-create step above), because nothing was looking at the release
      # itself. Publishing an incomplete draft is silent - the installer is
      # there, the app looks fine, and either updates never appear or every one
      # of them downloads the full ~94 MB.
      - name: Verify the published draft
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '[.[] | select(.tag_name=="'"$TAG"'")] | length')
          if [[ "$COUNT" -ne 1 ]]; then
            echo "EXPECTED exactly 1 release for $TAG, found $COUNT - the assets are probably split across them"
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.tag_name=="'"$TAG"'") | "  id=\(.id) draft=\(.draft) assets=\([.assets[].name]|join(","))"'
            exit 1
          fi
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name=="'"$TAG"'") | .assets[].name')
          echo "$ASSETS"
          for want in "latest.yml" "-setup.exe" "-setup.exe.blockmap"; do
            echo "$ASSETS" | grep -q -- "$want" || { echo "MISSING asset matching '$want'"; exit 1; }
          done
          echo "draft release for $TAG carries a complete update feed"

      # latest.yml and the blockmap ride along so a branch build is a complete,
      # testable update feed and not just an installer - serving these three
      # files is enough to exercise the updater end to end without cutting a
      # real release.
      - uses: actions/upload-artifact@v4
        with:
          name: blurt-windows-x64-setup
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
