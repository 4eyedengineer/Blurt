appId: com.blurt.app
productName: Blurt
# Electron-builder's default "asarIntegrity" feature embeds a SHA256 hash of
# app.asar's header into the exe (via a resedit-injected INTEGRITY
# resource), which Electron validates at startup - found the hard way: with
# it enabled, the packaged blurt.exe exited instantly (exit code
# 1, zero stdout/stderr, no Windows Error Reporting entry - a deliberate,
# silent tamper-response exit, not a crash) on every launch, while the exact
# same app.asar loaded fine via a plain `electron.exe <path-to-asar>`
# (bypasses the embedded-hash check entirely) - isolating the fault to this
# specific mechanism rather than the app's own code. Disabling it trades
# away that anti-tampering check (irrelevant for this app: no auto-update,
# no untrusted redistribution) for an app that actually starts.
#
# NOTE for the mac: build added below - this is a top-level setting, not a
# per-platform one, so it silently applies there too, not just to win:. The
# incident above is entirely a Windows PE mechanism (a resedit-injected
# INTEGRITY resource); nobody has run a macOS build yet, so whether
# disabling asarIntegrity does anything at all on mac - or is simply inert
# there because the mechanism it targets has no macOS equivalent - is
# untested. Left applying to both rather than scoped to win: only, since
# nothing about it is known to cause a problem on mac; revisit if a real
# Mac build ever suggests otherwise.
disableAsarIntegrity: true
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Any stray *.log file sitting in the project root (e.g. a build's own
  # captured output, redirected to a file by mistake) must never be picked
  # up by this glob - packing a file that's still being actively written
  # DURING the very build run that globs it corrupts the resulting asar's
  # internal offsets (hit this for real: out/main/index.js ended up
  # containing unrelated electron-builder log text instead of app code,
  # because build-win.log was growing mid-pack). Excluded unconditionally,
  # not just as a one-off cleanup.
  - '!**/*.log'
  # The dev-mode Python runtime (venv + litert-lm), created in-tree by
  # `npm run dev` - see src/main/runtime/. It is git-ignored, so it is
  # invisible until you try to package after having actually run the app,
  # at which point the build fails outright rather than degrading: a venv
  # symlinks its interpreter to the system Python, and electron-builder
  # refuses to follow a symlink pointing outside the package ("Cannot copy
  # file ... symlinked to file [/usr/bin/python3.11] outside the package").
  # Nothing here belongs in a Windows build anyway - the packaged app
  # provisions its own runtime under %LOCALAPPDATA% on first launch.
  - '!.runtime/**'
# serve_gpu.py ships OUTSIDE the asar entirely (not asarUnpack'd inside it) -
# a spawned child process reads it straight off disk, and it has no reason
# to live inside (or as an unpacked sibling of) the asar archive at all.
# extraResources copies resources/** directly into process.resourcesPath
# (the directory app.asar itself lives in) - see
# src/main/backend/gpuWrapperPath.ts for how that's resolved at runtime.
extraResources:
  - from: resources
    to: .
win:
  executableName: blurt
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # %APPDATA%\blurt (settings.json, history, downloaded model - up to ~6 GB)
  # is deliberately NOT deleted automatically on uninstall.
  # deleteAppDataOnUninstall would do that silently with no prompt, which is
  # backwards for a multi-GB model download - so instead both this directory
  # and the separate %LOCALAPPDATA%\Blurt runtime dir (see below) are
  # prompted for together in build/installer.nsh, the same way.
  deleteAppDataOnUninstall: false
  # Prompts (see build/installer.nsh) before removing %APPDATA%\blurt (see
  # above) and, separately, %LOCALAPPDATA%\Blurt (the shared Python venv +
  # litert-lm - several hundred MB, not something to delete silently since
  # it's also reused by dev builds) - electron-builder itself has no
  # knowledge of this second, non-userData runtime directory.
  include: build/installer.nsh
mac:
  # litert-lm-api (the LLM engine Blurt's Python sidecar depends on) has
  # published only a macosx_12_0_arm64 wheel on PyPI, in every release from
  # 0.12.0 through 0.14.0 - no x86_64, no universal2. A universal or x64
  # build would install and launch just fine on an Intel Mac (Electron
  # itself doesn't care about this), then fail later, during first-run
  # Python setup, when pip has no matching wheel to install - a worse,
  # later, more confusing failure than simply not shipping an Intel build
  # at all. arm64-only until litert-lm-api publishes something an Intel Mac
  # can actually use.
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  icon: build/icon.icns
  # Matches the floor of the arm64 wheel above - litert-lm-api has never
  # published for anything earlier than 12.0, so there's no point letting
  # the app install on an older macOS just to hit the same first-run pip
  # failure the x86_64 case would hit.
  minimumSystemVersion: '12.0'
  # electron-builder's own default, stated here explicitly: the entitlements
  # below (JIT, unsigned executable memory, microphone) only matter at all
  # when hardened runtime is actually on, so this line makes that dependency
  # visible instead of relying on a default that someone could change later
  # without realizing it takes the entitlements file's usefulness with it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # NSMicrophoneUsageDescription is required, not optional: on macOS, code
  # that touches the microphone without this Info.plist key present doesn't
  # get a denial dialog, it gets killed by the OS the moment it tries.
  # extendInfo is electron-builder's mechanism for injecting arbitrary extra
  # Info.plist keys like this one.
  extendInfo:
    NSMicrophoneUsageDescription: 'Blurt needs microphone access to transcribe your dictation. Audio is processed entirely on this Mac and never leaves your device.'
npmRebuild: false
